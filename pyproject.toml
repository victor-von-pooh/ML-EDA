[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-eda"
version = "0.1.0"
description = "機械学習に使うデータを読み込み, 分析し, 前処理して学習用に書き出すライブラリ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas>=2.0",
    "pyyaml"
]

[project.optional-dependencies]
parquet = [
    "pyarrow>=14"
]
excel = [
    "openpyxl>=3.1"
]
image = [
    "pillow>=10"
]
all = [
    "ml-eda[parquet,excel,image]"
]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
